<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game - Lily</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffd6e7, #d9f7ff);
        overflow: hidden;
    }

    .game-container {
        text-align: center;
        width: 95%;
        max-width: 500px;
    }

    h1 {
        margin: 5px 0;
        color: #ff4081;
        font-size: 32px;
    }

    .score {
        font-size: 20px;
        font-weight: bold;
        color: #444;
        margin-bottom: 10px;
    }

    canvas {
        width: 100%;
        max-width: 450px;
        aspect-ratio: 1 / 1;
        background: #fff;
        border: 5px solid #ff69a4;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        touch-action: none;
    }

    button {
        margin-top: 15px;
        padding: 12px 25px;
        border: none;
        border-radius: 25px;
        background: #ff4081;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.95);
    }

    .controls {
        margin: 15px auto;
        display: grid;
        grid-template-columns: 60px 60px 60px;
        grid-template-rows: 50px 50px;
        justify-content: center;
        gap: 6px;
    }

    .controls button {
        margin: 0;
        padding: 0;
        font-size: 24px;
        border-radius: 12px;
    }

    .up {
        grid-column: 2;
    }

    .left {
        grid-column: 1;
        grid-row: 2;
    }

    .down {
        grid-column: 2;
        grid-row: 2;
    }

    .right {
        grid-column: 3;
        grid-row: 2;
    }

    /* Birthday screen */

    .birthday {
        display: none;
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #ff9ec4, #ffd6e7, #fff0f6);
        justify-content: center;
        align-items: center;
        text-align: center;
        z-index: 10;
        padding: 20px;
    }

    .birthday-box {
        background: rgba(255,255,255,0.9);
        padding: 40px 25px;
        border-radius: 30px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        animation: pop 0.8s ease;
    }

    .birthday h2 {
        color: #ff4081;
        font-size: clamp(35px, 9vw, 65px);
        margin: 0;
    }

    .birthday p {
        font-size: 22px;
        color: #555;
        margin-top: 15px;
    }

    .heart {
        font-size: 55px;
        animation: heartbeat 1s infinite;
    }

    @keyframes pop {
        from {
            transform: scale(0);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    @keyframes heartbeat {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.3);
        }
    }

    .hint {
        color: #777;
        font-size: 14px;
        margin-top: 5px;
    }
</style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Lily's Snake Game</h1>

    <div class="score">
        Bites: <span id="score">0</span> / 10
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <div class="hint">
        Laptop: Use Arrow Keys • Phone: Swipe or use buttons
    </div>

    <div class="controls">
        <button class="up" onclick="changeDirection('up')">⬆️</button>
        <button class="left" onclick="changeDirection('left')">⬅️</button>
        <button class="down" onclick="changeDirection('down')">⬇️</button>
        <button class="right" onclick="changeDirection('right')">➡️</button>
    </div>

    <button onclick="restartGame()">🔄 Restart Game</button>

</div>


<!-- Birthday Screen -->

<div class="birthday" id="birthdayScreen">

    <div class="birthday-box">

        <div class="heart">❤️</div>

        <h2>
            Happy Birthday Lily!
        </h2>

        <p>
            🎉 You caught all 10! 🎉
        </p>

        <p>
            Wishing you lots of happiness, smiles and love! 💕
        </p>

        <button onclick="restartGame()">
            🐍 Play Again
        </button>

    </div>

</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;
const tileCount = canvas.width / grid;

let snake;
let food;
let dx;
let dy;
let score;
let gameRunning;
let gameLoop;

function startGame() {

    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    dx = 1;
    dy = 0;

    score = 0;

    gameRunning = true;

    document.getElementById("score").innerText = score;

    document.getElementById("birthdayScreen").style.display = "none";

    createFood();

    clearInterval(gameLoop);

    gameLoop = setInterval(updateGame, 250);
}


function updateGame() {

    if (!gameRunning) return;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // Wall collision

    if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
    ) {
        endGame();
        return;
    }

    // Snake collision

    for (let i = 0; i < snake.length; i++) {

        if (
            head.x === snake[i].x &&
            head.y === snake[i].y
        ) {
            endGame();
            return;
        }
    }

    snake.unshift(head);

    // Food eaten

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        document.getElementById("score").innerText = score;

        // 🎉 10 bites = Birthday surprise

        if (score >= 10) {

            gameRunning = false;

            clearInterval(gameLoop);

            setTimeout(showBirthday, 300);

            return;
        }

        createFood();

    } else {

        snake.pop();

    }

    drawGame();
}


function drawGame() {

    // Background

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Food

    ctx.font = "18px Arial";
    ctx.fillText("🍎", food.x * grid + 1, food.y * grid + 18);

    // Snake

    snake.forEach((part, index) => {

        if (index === 0) {

            ctx.fillStyle = "#ff4081";

        } else {

            ctx.fillStyle = "#7ed957";

        }

        ctx.fillRect(
            part.x * grid + 1,
            part.y * grid + 1,
            grid - 2,
            grid - 2
        );

    });

    // Snake eyes

    const head = snake[0];

    ctx.fillStyle = "white";

    ctx.fillRect(
        head.x * grid + 5,
        head.y * grid + 5,
        4,
        4
    );

    ctx.fillRect(
        head.x * grid + 12,
        head.y * grid + 5,
        4,
        4
    );
}


function createFood() {

    food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };

    // Don't put food on snake

    for (let part of snake) {

        if (
            part.x === food.x &&
            part.y === food.y
        ) {
            createFood();
            return;
        }
    }
}


function changeDirection(direction) {

    if (!gameRunning) return;

    if (
        direction === "up" &&
        dy !== 1
    ) {
        dx = 0;
        dy = -1;
    }

    if (
        direction === "down" &&
        dy !== -1
    ) {
        dx = 0;
        dy = 1;
    }

    if (
        direction === "left" &&
        dx !== 1
    ) {
        dx = -1;
        dy = 0;
    }

    if (
        direction === "right" &&
        dx !== -1
    ) {
        dx = 1;
        dy = 0;
    }
}


// Keyboard controls

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") {
        event.preventDefault();
        changeDirection("up");
    }

    if (event.key === "ArrowDown") {
        event.preventDefault();
        changeDirection("down");
    }

    if (event.key === "ArrowLeft") {
        event.preventDefault();
        changeDirection("left");
    }

    if (event.key === "ArrowRight") {
        event.preventDefault();
        changeDirection("right");
    }

});


// Touch / swipe controls

let startX = 0;
let startY = 0;

canvas.addEventListener("touchstart", function(event) {

    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;

}, {passive: true});


canvas.addEventListener("touchend", function(event) {

    const endX = event.changedTouches[0].clientX;
    const endY = event.changedTouches[0].clientY;

    const diffX = endX - startX;
    const diffY = endY - startY;

    if (Math.abs(diffX) > Math.abs(diffY)) {

        if (diffX > 30) {
            changeDirection("right");
        } else if (diffX < -30) {
            changeDirection("left");
        }

    } else {

        if (diffY > 30) {
            changeDirection("down");
        } else if (diffY < -30) {
            changeDirection("up");
        }

    }

}, {passive: true});


function endGame() {

    gameRunning = false;

    clearInterval(gameLoop);

    setTimeout(function() {

        alert("Game Over! 😄\n\nTry again!");

        restartGame();

    }, 100);

}


function showBirthday() {

    document.getElementById("birthdayScreen").style.display = "flex";

}


function restartGame() {

    startGame();

}


// Start automatically

startGame();

</script>

</body>
</html>
